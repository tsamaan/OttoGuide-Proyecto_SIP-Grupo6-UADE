map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: "codigo ottoguide/tests/fixtures/offline_navigation/offline_sandbox_test_map.yaml" # Ruta parametrizable en launch
    frame_id: "map"

# ATENCIÓN: yaml_filename es solo un valor de referencia; el launch
# offline_nav_sandbox.launch.py sobrescribe este parametro con el argumento
# 'map_yaml', cuyo default es el mapa sintetico versionado
# (SYNTHETIC_TEST_MAP, NOT_UADE_MAP, NOT_METRICALLY_VALIDATED,
# NOT_FOR_PHYSICAL_NAVIGATION). NO usar contra hardware fisico.
# Sandbox offline y smoke-test unicamente.

map_saver:
  ros__parameters:
    use_sim_time: false
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true

# OFFLINE_ONLY / SYNTHETIC / NOT_FOR_HARDWARE
# planner_server, global_costmap, controller_server y local_costmap son la
# planificacion global y control local de este sandbox. behavior_server
# (Wait, Spin), collision_monitor y bt_navigator (NavigateToPose unicamente)
# tambien estan configurados mas abajo. No hay Waypoint Follower ni Simple
# Commander.
planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.20
      use_astar: false
      allow_unknown: false

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      track_unknown_space: true
      always_send_full_costmap: true
      footprint: "[[0.15, 0.10], [0.15, -0.10], [-0.15, -0.10], [-0.15, 0.10]]"
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        subscribe_to_updates: false
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.30

# OFFLINE_ONLY / SYNTHETIC / NOT_FOR_HARDWARE
# controller_server unicamente para control local closed-loop simulado.
# Su unica salida de velocidad es el topico relativo 'cmd_vel_raw', remapeado
# en el launch desde 'cmd_vel'. Nunca publica /cmd_vel ni /cmd_vel_nav
# globales, y nunca llega a un bridge fisico.
#
# NOTA DE COMPATIBILIDAD LOCAL: el plugin solicitado originalmente para esta
# fase era nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController.
# Se comprobo en runtime que este ROS 2 Jazzy local no aplica parametros
# anidados bajo el namespace de un plugin (ni desde --params-file ni desde
# -p en linea de comandos): nodos como planner_server y controller_server
# ignoran silenciosamente esos valores y caen al default de stock Nav2.
# Para planner_server eso no rompe nada porque el default tambien es
# NavfnPlanner. Para controller_server el default es dwb_core::DWBLocalPlanner
# sin critics, que falla al configurar. Por eso este sandbox usa
# dwb_core::DWBLocalPlanner explicitamente, con los critics minimos
# necesarios para que cargue. Esta eleccion es exclusiva de este sandbox
# offline por una limitacion local detectada; no define ni recomienda el
# controlador para el robot fisico.
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.05
      movement_time_allowance: 10.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.25
      stateful: true

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      default_critic_namespaces: ["dwb_critics"]
      max_vel_x: 0.10
      min_vel_x: 0.0
      max_vel_theta: 0.30
      min_speed_xy: 0.0
      max_speed_xy: 0.10
      min_speed_theta: 0.0
      acc_lim_x: 0.50
      acc_lim_theta: 1.0
      decel_lim_x: -0.50
      decel_lim_theta: -1.0
      xy_goal_tolerance: 0.10
      trans_stopped_velocity: 0.01
      theta_stopped_velocity: 0.01

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 2
      height: 2
      resolution: 0.05
      footprint: "[[0.15, 0.10], [0.15, -0.10], [-0.15, -0.10], [-0.15, 0.10]]"
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: "scan"
        scan:
          topic: "scan"
          sensor_frame: "utlidar_lidar"
          data_type: "LaserScan"
          marking: true
          clearing: true
          max_obstacle_height: 2.0
          obstacle_max_range: 3.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.30

# OFFLINE_ONLY / SYNTHETIC / NOT_FOR_HARDWARE
# behavior_server exclusively for the offline sandbox, Phase 2E. Only Wait
# and Spin plugins are configured; BackUp, DriveOnHeading, AssistedTeleop,
# BT Navigator, Waypoint Follower and Simple Commander are explicitly out
# of scope for this phase. Its only velocity output is the relative topic
# 'cmd_vel', remapped in the launch to 'cmd_vel_raw' -- the same allowlisted
# topic controller_server publishes to -- so every behavior command must
# pass through collision_monitor before reaching the simulator. These
# conservative limits (max_rotational_vel <= 0.30 rad/s) are exclusive to
# this sandbox and do not represent the physical Unitree G1.
behavior_server:
  ros__parameters:
    use_sim_time: false
    enable_stamped_cmd_vel: false
    cycle_frequency: 10.0
    behavior_plugins: ["wait", "spin"]
    wait:
      plugin: "nav2_behaviors::Wait"
    spin:
      plugin: "nav2_behaviors::Spin"
    global_frame: "odom"
    robot_base_frame: "base_link"
    local_frame: "odom"
    transform_tolerance: 0.2
    simulate_ahead_time: 1.0
    max_rotational_vel: 0.30
    min_rotational_vel: 0.05
    rotational_acc_lim: 1.0

# OFFLINE_ONLY / SYNTHETIC / NOT_FOR_HARDWARE
# Collision Monitor exclusively for the offline sandbox.
# Configures a slowdown zone and a stop zone using /offline_nav/scan.
collision_monitor:
  ros__parameters:
    use_sim_time: false
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_raw"
    cmd_vel_out_topic: "cmd_vel_safe"
    transform_tolerance: 0.2
    source_timeout: 2.0
    stop_pub_timeout: 0.5
    polygons: ["slowdown_polygon", "stop_polygon"]
    slowdown_polygon:
      type: "polygon"
      points: "[[1.5, 0.5], [1.5, -0.5], [0.0, -0.5], [0.0, 0.5]]"
      action_type: "slowdown"
      min_points: 1
      slowdown_ratio: 0.4
      visualize: false
    stop_polygon:
      type: "polygon"
      points: "[[0.5, 0.5], [0.5, -0.5], [0.0, -0.5], [0.0, 0.5]]"
      action_type: "stop"
      min_points: 1
      visualize: false
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "scan"
      min_height: -2.0
      max_height: 2.0

# OFFLINE_ONLY / SYNTHETIC / NOT_FOR_HARDWARE
# bt_navigator exclusively for the offline sandbox, Phase 2F. Only the
# NavigateToPose navigator is configured; NavigateThroughPoses is
# intentionally absent. default_nav_to_pose_bt_xml is overridden at launch
# time via param_rewrites with the repository-relative, versioned path to
# offline_navigate_to_pose.xml (see offline_nav_sandbox.launch.py); the
# value below is only a placeholder, never read directly. No Waypoint
# Follower, no Simple Commander, no recoveries beyond what the minimal tree
# itself implements (none).
bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: "map"
    robot_base_frame: "base_link"
    odom_topic: "odom"
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    default_nav_to_pose_bt_xml: "OVERRIDDEN_AT_LAUNCH_TIME_BY_PARAM_REWRITES"
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

# OFFLINE_ONLY / SYNTHETIC / NOT_FOR_HARDWARE
# waypoint_follower exclusively for the offline sandbox, Phase 2G. Sends one
# NavigateToPose goal per waypoint to the already-validated bt_navigator
# (Phase 2F/2F.1); never publishes velocity directly. stop_on_failure is
# explicit (true): a single unreachable waypoint must abort the remaining
# route rather than skip ahead. waypoint_task_executor_plugin uses
# wait_at_waypoint (nav2_waypoint_follower::WaitAtWaypoint), the simplest
# stock plugin (sleeps for waypoint_pause_duration ms, no side effects, no
# camera, no scripts). No Simple Commander.
waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: true
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 0
