map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: "codigo ottoguide/tests/fixtures/offline_navigation/offline_sandbox_test_map.yaml" # Ruta parametrizable en launch
    frame_id: "map"

# ATENCIÓN: yaml_filename es solo un valor de referencia; el launch
# offline_nav_sandbox.launch.py sobrescribe este parametro con el argumento
# 'map_yaml', cuyo default es el mapa sintetico versionado
# (SYNTHETIC_TEST_MAP, NOT_UADE_MAP, NOT_METRICALLY_VALIDATED,
# NOT_FOR_PHYSICAL_NAVIGATION). NO usar contra hardware fisico.
# Sandbox offline y smoke-test unicamente.

map_saver:
  ros__parameters:
    use_sim_time: false
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true

# OFFLINE_ONLY / SYNTHETIC / NOT_FOR_HARDWARE
# planner_server y global_costmap son la unica planificacion habilitada en
# esta fase. No hay controller_server, local_costmap, behaviors, waypoint
# follower ni Collision Monitor configurados ni iniciados.
planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.20
      use_astar: false
      allow_unknown: false

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      track_unknown_space: true
      always_send_full_costmap: true
      footprint: "[[0.15, 0.10], [0.15, -0.10], [-0.15, -0.10], [-0.15, 0.10]]"
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        subscribe_to_updates: false
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.30
