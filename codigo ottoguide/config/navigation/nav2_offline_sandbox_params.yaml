map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: "codigo ottoguide/tests/fixtures/offline_navigation/offline_sandbox_test_map.yaml" # Ruta parametrizable en launch
    frame_id: "map"

# ATENCIÓN: yaml_filename es solo un valor de referencia; el launch
# offline_nav_sandbox.launch.py sobrescribe este parametro con el argumento
# 'map_yaml', cuyo default es el mapa sintetico versionado
# (SYNTHETIC_TEST_MAP, NOT_UADE_MAP, NOT_METRICALLY_VALIDATED,
# NOT_FOR_PHYSICAL_NAVIGATION). NO usar contra hardware fisico.
# Sandbox offline y smoke-test unicamente.

map_saver:
  ros__parameters:
    use_sim_time: false
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 20.0

controller_server:
  ros__parameters:
    use_sim_time: false

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: false
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: false
      resolution: 0.05
      track_unknown_space: true
