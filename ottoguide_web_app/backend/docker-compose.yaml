# docker-compose del backend de OttoGuide.
# Corre DENTRO del robot. Levanta el backend completo en el puerto 3000.
#
# Para que arranque solo cada vez que se enciende el robot:
#   1) restart: always  -> Docker vuelve a levantar el contenedor al iniciar el daemon y si se cae.
#   2) En el robot, habilitar el daemon de Docker en el arranque:  sudo systemctl enable docker
#
# Levantar:   docker compose up -d --build
# Ver logs:   docker compose logs -f
# Frenar:     docker compose down

services:
  backend:
    build: .
    container_name: ottoguide-backend
    restart: always
    # network_mode: host es necesario para leer ROS 2 / DDS o lanzar procesos del host
    network_mode: host
    # El mapeo de ports se ignora con network_mode: host, pero el puerto 3000 quedara expuesto igual
    ports:
      - "3000:3000"
    environment:
      # MOCK_MODE=true  -> telemetria simulada (sirve para desarrollar/demostrar sin sensores).
      # MOCK_MODE=false -> telemetria real del robot (ROS 2 / DDS). Ver telemetry_source.py.
      - MOCK_MODE=${MOCK_MODE:-true}
      - PORT=${PORT:-3000}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - DDS_INTERFACE=${DDS_INTERFACE:-eth0}
      - DDS_TIMEOUT_S=${DDS_TIMEOUT_S:-5}
      - ROBOT_REPO_DIR=${ROBOT_REPO_DIR:-/home/unitree/Desktop/Ottoguide/OttoGuide-Proyecto_SIP-Grupo6-UADE/codigo ottoguide}
      - OTTO_PIPELINE_BIN=${OTTO_PIPELINE_BIN:-otto_pipeline}
    
    # --- Integracion real con el robot ---
    # Montamos la carpeta del robot (read-only) para poder lanzar los ejecutables
    volumes:
      - /home/unitree/Desktop/Ottoguide:/home/unitree/Desktop/Ottoguide:ro
    # Necesario para acceso a dispositivos/red del robot (DDS)
    privileged: true
